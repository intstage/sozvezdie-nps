function critTable(list){
  // На телефоне (≤640px) таблица превращается в карточки: подписи колонок — из data-l.
  const td=(cls,l,html)=>`<td class="${cls}" data-l="${l}"><div>${html}</div></td>`;
  return`<div class="tbl-wrap"><table class="stack"><thead><tr><th>Клиент</th><th>Тип</th><th>Заявка</th><th>ID_FB</th><th>Рейс</th><th class="r">Оценка</th><th>Низкие оценки</th><th>Комментарий</th></tr></thead><tbody>${list.map(r=>{const low=r[3].map((v,k)=>v!=null&&v<=6&&k?SHORT[k]:null).filter(Boolean);return`<tr data-aid="${esc(anketaId(r))}">${
    td('st-title','Клиент',esc(r[6]||'—'))+td('','Тип',esc(r[7]||'—'))+td('','Заявка',esc(r[8]||'—'))+td('nw','ID_FB',esc(r[10]||'—'))+
    td('nw','Рейс',`${esc(r[0])}<br><span class="muted">${esc(r[1].slice(0,5))}</span>`)+td('r','Оценка',sc(r[3][0]))+
    td('','Низкие оценки',low.map(x=>`<span class="chip bad">${x}</span>`).join('')||'<span class="muted">—</span>')+
    (r[5]?td('st-text','Комментарий',esc(r[5])):'<td class="st-text st-empty"></td>')}</tr>`}).join('')}</tbody></table></div>`}

/* Клиенты → «Скачать список»: CSV для Excel («;», UTF-8 с BOM) со всеми клиентами по текущим фильтрам.
   В Telegram файл присылает бот в чат (из Mini App браузерное скачивание не работает); вне Telegram — обычное скачивание. */
const CTYPES=['Частное лицо','Агентство','ИП'];
function clientsCsv(L){
  const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[";\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};   // «'» — чтобы Excel не принял текст за формулу
  const head=['Клиент','Тип','Заявка','ID_FB','Теплоход','Рейс','Маршрут','Бывал раньше','Рекомендация','Низкие оценки (0–6)','Каюта','Официант','Комментарий'];
  const rows=L.map(r=>{const t=trips[r[11]];return[r[6],r[7],r[8],r[10],r[0],t?`${t.dep}–${t.arr}`:r[1],t&&t.routeKnown?t.route:'',r[2],r[3][0],
    r[3].map((v,k)=>k&&v!=null&&v<=6?SHORT[k]+' '+v:null).filter(Boolean).join(', '),r[9],r[4],r[5]]});
  return[head,...rows].map(x=>x.map(cell).join(';')).join('\r\n');
}
function downloadClients(L,who){
  const msg=$('#cl-dl-msg'),btn=$('#cl-dl');
  const say=(t,bad)=>{msg.hidden=false;msg.style.color=bad?'var(--bad)':'';msg.textContent=t};
  const d=new Date(),name=`Клиенты_NPS_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.csv`,csv=clientsCsv(L);
  const caption=`${L.length} ${who}`+(S.ct.length<CTYPES.length?` · тип: ${S.ct.join(', ')}`:'')+(S.q?` · поиск «${S.q}»`:'');
  TG_INIT.then(i=>SZ_LOGIN||i).then(init=>{
    if(init&&window.google&&google.script&&google.script.run){btn.disabled=true;say('Готовлю файл…');
      google.script.run.withSuccessHandler(n=>{btn.disabled=false;say(`Файл «${n}» отправлен вам в чат с ботом.`)})
        .withFailureHandler(e=>{btn.disabled=false;say('Не удалось отправить файл: '+(e&&e.message||e),true)}).sendClientsCsv(init,csv,caption);return}
    if(init&&window.SZ_API){btn.disabled=true;say('Готовлю файл…');
      szApi('csv',{init,csv,caption}).then(t=>{btn.disabled=false;say(`Файл «${JSON.parse(t)}» отправлен вам в чат с ботом.`)},
        e=>{btn.disabled=false;say('Не удалось отправить файл: '+(e&&e.message||e),true)});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);say(`Файл «${name}» скачан: ${caption}.`)});
}

function vClients(){
  if(LC_PART){$('#filters').innerHTML='';$('#view').innerHTML='<div class="loading"><div class="spin"></div>Загружаю список клиентов…</div>';return}
  const R=DATA.rows.filter(r=>r[3][0]!=null);
  const npsOf=L=>{const n=L.length;if(!n)return{nps:null,n:0,P:0,N:0,D:0};const P=L.filter(r=>r[3][0]>=9).length,D=L.filter(r=>r[3][0]<=6).length;return{P,D,N:n-P-D,n,nps:Math.round((P-D)/n*100)}};
  const seg=[['Частные лица',R.filter(r=>r[7]==='Частное лицо')],['Агентства',R.filter(r=>r[7]==='Агентство')],['ИП',R.filter(r=>r[7]==='ИП')],['Бывали раньше (по анкете)',R.filter(r=>r[2]==='Да')],['Первый круиз',R.filter(r=>r[2]==='Нет')],['Без привязки к заявке',R.filter(r=>!r[8])]].map(([l,L])=>({l,...npsOf(L)}));
  if(!Array.isArray(S.ct))S.ct=CTYPES.slice();
  $('#filters').innerHTML=`<div class="fgroup"><span class="flbl">Оценка</span><div class="seg" role="group" aria-label="Кого показать"><button data-cf="crit" aria-pressed="${S.cf==='crit'}">Критики 0–6</button><button data-cf="neu" aria-pressed="${S.cf==='neu'}">Нейтральные 7–8</button><button data-cf="pro" aria-pressed="${S.cf==='pro'}">Сторонники 9–10</button><button data-cf="all" aria-pressed="${S.cf==='all'}">Все</button></div></div>
   <div class="fgroup"><span class="flbl">Тип клиента</span><div class="checks" role="group" aria-label="Тип клиента">${CTYPES.map(c=>`<label><input type="checkbox" data-ct="${esc(c)}"${S.ct.includes(c)?' checked':''}>${esc(c)}</label>`).join('')}</div></div>
   <label for="f-q" class="grow">Поиск<input type="search" id="f-q" placeholder="ФИО, заявка, теплоход" value="${esc(S.q)}"></label>`;
  $('#filters').onclick=e=>{const b=e.target.closest('[data-cf]');if(b){S.cf=b.dataset.cf;save();render()}};
  $('#filters').onchange=e=>{if(!e.target.dataset.ct)return;S.ct=[...$('#filters').querySelectorAll('[data-ct]:checked')].map(x=>x.dataset.ct);save();drawList()};
  const f={crit:r=>r[3][0]<=6,neu:r=>r[3][0]>=7&&r[3][0]<=8,pro:r=>r[3][0]>=9,all:()=>true}[S.cf];
  const who=()=>({crit:'критиков (0–6)',neu:'нейтральных (7–8)',pro:'сторонников (9–10)',all:'анкет'}[S.cf]);
  // все отмечены — показываем и клиентов без типа в заявке; иначе только отмеченные типы
  const list=()=>{const q=norm(S.q),all=S.ct.length===CTYPES.length;return R.filter(f).filter(r=>r[6]&&(all||S.ct.includes(r[7]))).filter(r=>!q||norm(r.join(' ')).includes(q))};
  const drawList=()=>{const q=norm(S.q),L=list();
    const types=S.ct.length===CTYPES.length?'':S.ct.length?' · тип: '+S.ct.map(esc).join(', '):' · не выбран ни один тип клиента';
    $('#cl-list').innerHTML=`<p class="sub">${L.length} ${who()} с указанным покупателем${types}${q?' · по запросу «'+esc(S.q)+'»':''} · всего с покупателем: ${R.filter(r=>r[6]).length}${L.length>150?' · на странице первые 150, в файле — все':''}</p>`+(L.length?critTable(L.slice(0,150)):'<p class="muted">Никого не нашлось — измените фильтр или поиск.</p>');
    $('#cl-dl').disabled=!L.length};
  const W=560,rowH=40,Lw=170,Rw=50,x=v=>Lw+(W-Lw-Rw)*Math.max(0,v)/100;
  const vv=$('#view');
  vv.innerHTML=`<div class="grid">
   <div class="grid g-kpi">${kpiNps('NPS частных лиц',seg[0],seg[1].nps,'к агентствам')}${kpiNps('NPS агентств',seg[1])}${kpiNps('NPS повторных гостей (по анкете)',seg[3],seg[4].nps,'к новичкам')}${kpiPlain('Критиков к обзвону',R.filter(r=>r[3][0]<=6&&r[6]).length,'клиентов','есть ФИО и номер заявки')}</div>
   <div class="grid g-2"><div class="panel"><h2>NPS по сегментам клиентов</h2><p class="sub">Анкеты, сопоставленные с заявками ACP</p>
   <svg viewBox="0 0 ${W} ${seg.length*rowH+10}" width="100%" role="img" aria-label="NPS по сегментам">${seg.map((s,i)=>`<g data-tip="<b>${s.l}</b><br>NPS ${s.nps} · ${s.n} анкет<br>Сторонники ${s.P} · критики ${s.D}"><text x="0" y="${i*rowH+17}" style="fill:var(--ink);font-size:12.5px">${s.l}</text><text x="0" y="${i*rowH+31}">${s.n} анкет</text><rect x="${Lw}" y="${i*rowH+10}" width="${x(s.nps)-Lw}" height="14" rx="4" fill="${ZC[zone(s.nps,s.n)]}"/><text x="${x(s.nps)+6}" y="${i*rowH+21.5}" style="fill:var(--ink);font-weight:600">${s.nps}</text></g>`).join('')}</svg></div>
   <div class="panel"><h2>Что чаще всего ругают критики</h2><p class="sub">Пункты, где клиенты-критики ставят 0–6</p>${(()=>{const C=R.filter(r=>r[3][0]<=6);const cnt=SHORT.map((s,k)=>({s,c:k?C.filter(r=>r[3][k]!=null&&r[3][k]<=6).length:0})).filter(x=>x.c).sort((a,b)=>b.c-a.c).slice(0,7);const mx=cnt[0]?.c||1;return`<ul class="zone-list">${cnt.map(x=>`<li style="grid-template-columns:minmax(110px,1.3fr) 2fr 40px"><span>${x.s}</span><div class="bar"><i style="width:${x.c/mx*100}%;background:var(--bad)"></i></div><span class="num">${x.c}</span></li>`).join('')}</ul><p class="sub" style="margin-top:10px">Из ${C.length} критиков в выборке</p>`})()}</div></div>
   <div class="panel"><div class="ph-head"><h2>Клиенты по оценке</h2><button type="button" class="btn" id="cl-dl" title="Файл CSV со всеми клиентами по текущим фильтрам">Скачать список</button></div><p class="sub" id="cl-dl-msg" hidden></p><div id="cl-list"></div></div></div>`;
  drawList();
  $('#cl-dl').onclick=e=>{if(e.detail)e.currentTarget.blur();downloadClients(list(),who())};
  $('#f-q').oninput=e=>{S.q=e.target.value;save();drawList()};
  bindNav(vv);
}

  ['Обновление','Данные хранятся 15 минут. «Обновить данные» перечитывает таблицу, но не чаще раза в минуту.']
].map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')+'</dl>';
/** Узкий экран: название — в одну строку; кнопки — кружки; если не влезает, уменьшаем название. */
function fitHeader(){
  const h1=document.querySelector('.brand h1'),ma=document.querySelector('.m-actions'),t=h1&&h1.querySelector('.h1-title');
  if(!h1||!ma||!t)return;
  t.style.fontSize='';
  if(getComputedStyle(ma).display==='none')return;
  const fits=()=>{const gap=parseFloat(getComputedStyle(h1).columnGap)||12;return t.scrollWidth+gap+ma.getBoundingClientRect().width<=h1.clientWidth+1};
  ma.classList.remove('fit-short');ma.classList.add('fit-icon');            // на телефоне обновление — кружок, как в «Заявках»
  if(fits())return;
  for(let px=parseFloat(getComputedStyle(t).fontSize)-1;px>=17&&!fits();px--)t.style.fontSize=px+'px';   // кнопка уже кружок — уменьшаем название, не мельче 17 px
}
addEventListener('resize',fitHeader);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitHeader);
/** Высота прилипшей строки вкладок — к ней прилипают заголовки таблиц. */

addEventListener('scroll',()=>{$('#btn-top').hidden=scrollY<400},{passive:true});

render();
load(false);
navState();fitHeader();navHeight();
